services:
  pi-app:
    image: ${PI_IMAGE:-privacyidea:test}
    build:
      context: .
      args:
        PI_VERSION: main
    environment:
      - PI_DB_VENDOR=sqlite
      - PI_ADMIN_USER=${PI_ADMIN_USER:-ci-admin}
      - PI_ADMIN_PASSWORD=${PI_ADMIN_PASSWORD:-ci-admin-password}
      - PI_SECRET_KEY=suppersecretkey_privacyidea_min32bytes_secret!
      - PI_PEPPER=secretworduseforadminencrypt
      - PI_PAGE_TITLE=pivacyIDEA
      - PI_BASE_URL=http://localhost:8080
    volumes:
      - test_data:/data/privacyidea
      - test_config:/etc/privacyidea
  sut:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    depends_on:
      - pi-app
    environment:
      SOURCE_BRANCH: ${SOURCE_BRANCH:-}
      PI_ADMIN_USER: ${PI_ADMIN_USER:-ci-admin}
      PI_ADMIN_PASSWORD: ${PI_ADMIN_PASSWORD:-ci-admin-password}
    command: /tmp/run-tests.sh
    volumes:
      - ./run-tests.sh:/tmp/run-tests.sh:ro
      - ./tests/integration-provisioned-api.sh:/tmp/integration-provisioned-api.sh:ro

volumes:
  test_data:
  test_config:
