services:
  pi-app:
    image: ${PI_IMAGE:-privacyidea:test}
    build:
      context: .
      args:
        PI_VERSION: main
    environment:
      - PI_SECRET_KEY="suppersecretkey"
      - PI_PEPPER="secretworduseforadminencrypt"
      - PI_PAGE_TITLE=pivacyIDEA
      - PI_BASE_URL=http://localhost:8080
  sut:
      image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
      depends_on:
        - pi-app
      environment:
        - SOURCE_BRANCH
      command: /tmp/run-tests.sh
      volumes:
        - "./run-tests.sh:/tmp/run-tests.sh:ro"
