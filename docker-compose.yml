services:
  pi-db:
    image: mariadb:13.0
    ports:
      - '3306:3306'
    environment:
      - MARIADB_DATABASE=privacyidea
      - MARIADB_USER=privacyidea
      - MARIADB_ROOT_PASSWORD=${PI_DB_ROOT_PASSWORD:-privacyidea_root}
      - MARIADB_PASSWORD=${PI_DB_PASSWORD:-privacyidea@123}
    volumes:
      - pi_db_data:/var/lib/mysql
  pi:
    build: .
    ports:
      - '8080:8080'
    environment:
      - PI_DB_VENDOR=mariadb
      - PI_DB_NAME=privacyidea
      - PI_DB_HOST=pi-db
      - PI_DB_USER=privacyidea
      - PI_DB_PASSWORD=privacyidea@123
      - PI_SECRET_KEY=suppersecretkey_privacyidea_min32bytes_secret!
      - PI_PEPPER=secretworduseforadminencrypt
      - PI_ADMIN_USER=admin
      - PI_ADMIN_PASSWORD=privacyidea
      - PI_PAGE_TITLE=pivacyIDEA
      - PI_SUPERUSER_REALM=administrator,api
      - PI_DB_ARGS=ssl_check_hostname=false
      - PI_BASE_URL=http://localhost:8080
    depends_on:
      - pi-db
  wp-db:
    image: mariadb:13.0
    ports:
      - '3307:3306'
    environment:
      - MARIADB_DATABASE=wordpress
      - MARIADB_USER=wordpress
      - MARIADB_ROOT_PASSWORD=${WP_DB_ROOT_PASSWORD:-wordpress_root}
      - MARIADB_PASSWORD=${WP_DB_PASSWORD:-wordpress}
    volumes:
      - wp_db_data:/var/lib/mysql
  wp:
    image: wordpress:6
    ports:
      - '8081:80'
    depends_on:
      - wp-db
    environment:
      - WORDPRESS_DB_HOST=wp-db:3306
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress

volumes:
  pi_db_data:
  wp_db_data:
