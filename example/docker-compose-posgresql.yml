services:
  postgresql:
    image: postgres:14
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=privacyidea
      - POSTGRES_USER=privacyidea
      - POSTGRES_PASSWORD=privacyidea
    volumes:
      - postgresql_data:/var/lib/postgresql/data
  privacyidea:
    image: 'docker.io/kheeklab/privacyidea:dev'
    ports:
      - '8080:8080'
    environment:
      - PI_DB_VENDOR=postgresql
      - PI_DB_NAME=privacyidea
      - PI_DB_HOST=postgresql
      - PI_DB_USER=privacyidea
      - PI_DB_PASSWORD=privacyidea
      - PI_SECRET_KEY=suppersecretkey
      - PI_PEPPER=secretworduseforadminencrypt
      - PI_ADMIN_USER=admin
      - PI_ADMIN_PASSWORD=privacyidea
      - PI_PAGE_TITLE=pivacyIDEA
      - PI_SUPERUSER_REALM=administrator,api
      - PI_DB_ARGS=ssl_check_hostname=false
      - PI_BASE_URL=http://localhost:8080
    depends_on:
      - postgresql

volumes:
  postgresql_data:
