name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'release (ref must be a v* release or rebuild tag) or edge (ref must be main)'
        type: choice
        options:
          - release
          - edge
        default: release
      pi_version:
        description: 'Release channel: privacyIDEA version without the v prefix. Numeric release tags require it and it must match the tag; on a rebuild tag it is optional but must equal the installed version. Omit for edge.'
        required: false
        type: string

# No permissions by default. Every job grants only what it needs, and pull
# requests are handled by ci.yml, so untrusted code never reaches this file.
permissions: {}

env:
  PI_MIN_SUPPORTED_VERSION: '3.14'
  # A new rebuild intent may not be backdated further than this. Retrying an
  # already accepted intent keeps its recorded date and digest.
  REBUILD_INTENT_MAX_AGE_DAYS: '7'

# Supported invocations. Routing lives in .github/scripts/resolve-release-input.sh
# and is regression-tested by tests/test-release-input.sh and
# tests/test-release-refs.sh; operator guidance lives in docs/release-runbook.md.
#
#   push of a numeric v<version> tag          -> route=numeric
#   push of a rebuild tag v<V>-<YYYYMMDD>[..] -> route=rebuild
#   push to main                              -> route=edge
#   workflow_dispatch channel=release on either tag kind -> same routes
#   workflow_dispatch channel=edge, ref main  -> route=edge
#
# A numeric release publishes its dated identity, the plain alias, v<V> and
# sha-<12>, creates a GitHub release and may move `latest`. A rebuild publishes
# only its dated identity and the plain alias in both registries: no v<V>, no
# latest, no edge, no sha-<12>, no GitHub release.
#
# Edge runs publish GHCR `edge` and `sha-<12>` only: no GitHub release, no
# Docker Hub credentials, no `latest` move. Any other combination fails in
# `validate` before a credential is used, naming the command that works.
jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      route: ${{ steps.validate.outputs.route }}
      identity: ${{ steps.validate.outputs.identity }}
      requirements_ref: ${{ steps.validate.outputs.requirements_ref }}
      channel: ${{ steps.validate.outputs.channel }}
      staging_tag: ${{ steps.validate.outputs.staging_tag }}
      sha_short: ${{ steps.validate.outputs.sha_short }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate ref and version
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_VERSION: ${{ github.event.inputs.pi_version }}
          PI_MIN_SUPPORTED_VERSION: ${{ env.PI_MIN_SUPPORTED_VERSION }}
          REBUILD_INTENT_MAX_AGE_DAYS: ${{ env.REBUILD_INTENT_MAX_AGE_DAYS }}
        run: .github/scripts/resolve-release-input.sh

      # A GitHub release is the numeric publication ledger. If it exists the
      # numeric version was fully published, so retries are no-ops. A rebuild
      # never has a GitHub release and is never skipped here: its idempotency
      # comes from the accepted intent and the digest read back from both
      # registries.
      - name: Decide whether to publish
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.validate.outputs.channel }}
          ROUTE: ${{ steps.validate.outputs.route }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          publish=true
          if [[ "$CHANNEL" == "release" && "$ROUTE" == "numeric" ]]; then
            if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v${VERSION} already has a release; numeric publication is idempotent and will be skipped"
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The dated image identity is reserved and recorded before the build, so the
  # identity and its UTC date are fixed and a failed run resumes the same
  # intent instead of inventing a new name. Runs under the same concurrency
  # group as publication, so reservations serialize with promotions.
  reserve:
    name: Reserve image release identity
    needs: validate
    if: needs.validate.outputs.publish == 'true' && needs.validate.outputs.channel == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    outputs:
      identity: ${{ steps.reserve.outputs.identity }}
      action: ${{ steps.reserve.outputs.action }}
      tested_digest: ${{ steps.reserve.outputs.tested_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Resolve GHCR target
        id: targets
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ghcr_repo=ghcr.io/${owner}/privacyidea" >> "$GITHUB_OUTPUT"

      - name: Reserve dated image identity
        id: reserve
        shell: bash
        env:
          ROUTE: ${{ needs.validate.outputs.route }}
          VERSION: ${{ needs.validate.outputs.version }}
          IDENTITY: ${{ needs.validate.outputs.identity }}
          REF_NAME: ${{ github.ref_name }}
          GHCR_REPO: ${{ steps.targets.outputs.ghcr_repo }}
          REQUIREMENTS_REF: ${{ needs.validate.outputs.requirements_ref }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          INTENTS_REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          INTENT_STORE_DIR: ${{ runner.temp }}/release-intents
          REBUILD_INTENT_MAX_AGE_DAYS: ${{ env.REBUILD_INTENT_MAX_AGE_DAYS }}
        run: bash .github/scripts/promote-release.sh reserve

  build:
    name: Build staging image
    needs: [validate, reserve]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.publish == 'true' &&
      (needs.validate.outputs.channel == 'edge' || needs.reserve.outputs.action == 'build')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.staging.outputs.digest }}
      sha_short: ${{ needs.validate.outputs.sha_short }}
      dockerhub: ${{ steps.targets.outputs.dockerhub }}
      namespace: ${{ steps.targets.outputs.namespace }}
      hub_digest: ${{ steps.staging.outputs.hub_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Staging tags are build identities, never consumer tags. Docker Hub
      # staging is required because a cross-registry index copy is not proven;
      # see the deviation note in the pull request and PERS-56 ADR-003.
      - name: Resolve staging targets
        id: targets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          STAGING_TAG: ${{ needs.validate.outputs.staging_tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          namespace="${DOCKERHUB_NAMESPACE:-$owner}"
          dockerhub=false

          # Docker Hub credentials exist only for release-channel runs. Edge
          # builds from main are GHCR-only, so the credential is never
          # reachable from an unattended main push.
          if [[ "$CHANNEL" == "release" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
              echo "::error::Docker Hub credentials are required for a release but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not configured"
              exit 1
            fi
            dockerhub=true
          fi
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${owner}/privacyidea:${STAGING_TAG}"
            if [[ "$dockerhub" == "true" ]]; then
              echo "${namespace,,}/privacyidea:${STAGING_TAG}"
            fi
            echo 'EOF'
            echo "dockerhub=${dockerhub}"
            echo "namespace=${namespace,,}"
            echo "owner=${owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.targets.outputs.tags }}
          build-args: |
            PI_VERSION=${{ needs.validate.outputs.version }}
            PI_REQUIREMENTS_REF=${{ needs.validate.outputs.requirements_ref }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record staging digest
        id: staging
        shell: bash
        env:
          STAGING_TAG: ${{ needs.validate.outputs.staging_tag }}
          OWNER: ${{ steps.targets.outputs.owner }}
          DOCKERHUB_ENABLED: ${{ steps.targets.outputs.dockerhub }}
          DOCKERHUB_NAMESPACE: ${{ steps.targets.outputs.namespace }}
        run: |
          set -euo pipefail
          ghcr_ref="ghcr.io/${OWNER}/privacyidea:${STAGING_TAG}"
          digest=$(docker buildx imagetools inspect "$ghcr_ref" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Unexpected staging digest for ${ghcr_ref}: ${digest}" >&2
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "staging ${ghcr_ref} ${digest}"
          if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
            dockerhub_ref="${DOCKERHUB_NAMESPACE}/privacyidea:${STAGING_TAG}"
            dockerhub_digest=$(docker buildx imagetools inspect "$dockerhub_ref" --format '{{.Manifest.Digest}}')

            # The tested artifact is the GHCR index. A Docker Hub staging copy
            # that is not byte-identical must never reach a consumer tag.
            if [[ "$dockerhub_digest" != "$digest" ]]; then
              echo "::error::Docker Hub staging digest ${dockerhub_digest} differs from tested GHCR staging digest ${digest}; refusing to promote"
              exit 1
            fi
            echo "hub_digest=${dockerhub_digest}" >> "$GITHUB_OUTPUT"
            echo "staging ${dockerhub_ref} ${dockerhub_digest}"
          fi

  test:
    name: Test ${{ matrix.arch }} staging image
    needs: [validate, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GHCR (read only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the exact tested index digest on a native runner. No image is
      # rebuilt here, so the tested manifests are the published manifests.
      - name: Pull staging image by digest
        shell: bash
        env:
          STAGING_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker pull "ghcr.io/${owner}/privacyidea@${STAGING_DIGEST}"
          docker tag "ghcr.io/${owner}/privacyidea@${STAGING_DIGEST}" privacyidea:test

      - name: Install container-structure-test
        env:
          CST_VERSION: 1.22.1
          CST_AMD64_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
          CST_ARM64_SHA256: 801826ed107222120eb6df8c143b7de752cfebbe3aebfeea576e7098486917c2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$CST_AMD64_SHA256" ;;
            aarch64|arm64) arch=arm64; sha="$CST_ARM64_SHA256" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          binary="/tmp/container-structure-test"
          curl -fsSL -o "$binary" \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CST_VERSION}/container-structure-test-linux-${arch}"
          echo "${sha}  ${binary}" | sha256sum -c -
          chmod +x "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/container-structure-test
          container-structure-test version

      - name: Container structure test
        run: container-structure-test test --image privacyidea:test --config structure-tests.yaml

      - name: Integration test
        run: |
          set -euo pipefail
          docker compose --file docker-compose-test.yml up --no-build --exit-code-from sut --timeout 120
          docker compose --file docker-compose-test.yml down -v

      - name: Assert installed privacyIDEA version
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          installed=$(docker run --rm --entrypoint /opt/privacyidea/bin/python privacyidea:test \
            -c 'import importlib.metadata as m; print(m.version("privacyIDEA"))')
          echo "expected=${EXPECTED_VERSION} installed=${installed}"
          if [[ "$installed" != "$EXPECTED_VERSION" ]]; then
            echo "Installed privacyIDEA ${installed} does not match requested ${EXPECTED_VERSION}" >&2
            exit 1
          fi

      # Fixed CRITICAL findings block promotion; unfixed ones are reported but
      # cannot block (base-image CVEs are not fixable here). Time-boxed
      # exceptions belong in .trivyignore with an owner and expiry comment.
      #
      # Two scans on purpose: trivy-action v0.36.0 unsets TRIVY_SEVERITY for
      # SARIF output unless limit-severities-for-sarif is set, so a single
      # SARIF step with exit-code 1 fails on every severity. This step only
      # reports (exit-code 0) and feeds code scanning; the table step below is
      # the sole blocking gate and does honour severity: CRITICAL.
      - name: Trivy scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: privacyidea:test
          # Pin the scanner explicitly. The action's baked default (v0.70.0)
          # otherwise decides which scanner and vulnerability database the
          # scan runs against, and can drift without a diff in this repo.
          version: v0.76.2
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'
          vuln-type: os,library

      - name: Trivy scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: privacyidea:test
          version: v0.76.2
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.arch }}

      - name: Cleanup compose stack
        if: always()
        run: docker compose --file docker-compose-test.yml down -v || true

  publish:
    name: Promote tested image
    needs: [validate, reserve, build, test]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.publish == 'true' &&
      needs.validate.outputs.channel == 'release' &&
      (needs.reserve.outputs.action == 'promote-only' ||
       (needs.build.result == 'success' && needs.test.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
    # Serialize publication so two releases cannot interleave identity
    # reservation, alias moves or latest.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve publication targets
        id: targets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Docker Hub credentials are required for a release but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not configured"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          namespace="${DOCKERHUB_NAMESPACE:-$owner}"
          {
            echo "owner=${owner}"
            echo "namespace=${namespace,,}"
            echo "ghcr_repo=ghcr.io/${owner}/privacyidea"
            echo "hub_repo=${namespace,,}/privacyidea"
          } >> "$GITHUB_OUTPUT"

      # A resumed run (promote-only) must promote the digest the accepted
      # intent retained, never a freshly built one, and never a rebuilt image.
      - name: Resolve tested digest
        id: tested
        shell: bash
        env:
          RESUME_ACTION: ${{ needs.reserve.outputs.action }}
          RESUME_DIGEST: ${{ needs.reserve.outputs.tested_digest }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$RESUME_ACTION" == "promote-only" ]]; then
            digest="$RESUME_DIGEST"
            echo "resuming the retained tested digest ${digest}; no image was rebuilt"
          else
            digest="$BUILD_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No tested multi-arch index digest to promote (got '${digest}')"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Preflight, guards, ordered writes, readbacks, freeze on mismatch and
      # the promotion journal all live in the tested script.
      - name: Promote dated identity and aliases
        id: promote
        shell: bash
        env:
          ROUTE: ${{ needs.validate.outputs.route }}
          VERSION: ${{ needs.validate.outputs.version }}
          IDENTITY: ${{ needs.reserve.outputs.identity }}
          REF_NAME: ${{ github.ref_name }}
          REQUIREMENTS_REF: ${{ needs.validate.outputs.requirements_ref }}
          GHCR_REPO: ${{ steps.targets.outputs.ghcr_repo }}
          HUB_ENABLED: 'true'
          HUB_REPO: ${{ steps.targets.outputs.hub_repo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_DIGEST: ${{ steps.tested.outputs.digest }}
          HUB_DIGEST: ${{ needs.build.outputs.hub_digest || steps.tested.outputs.digest }}
          SHA_SHORT: ${{ needs.validate.outputs.sha_short }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          INTENTS_REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          INTENT_STORE_DIR: ${{ runner.temp }}/release-intents
          JOURNAL: ${{ runner.temp }}/promotion-journal.md
          REBUILD_INTENT_MAX_AGE_DAYS: ${{ env.REBUILD_INTENT_MAX_AGE_DAYS }}
        run: bash .github/scripts/promote-release.sh promote

      # The notes state the upstream version, the installed distribution
      # version as tested, the image release identifier and the tested digest
      # separately, so an image rebuild is never presented as an upstream
      # patch release.
      - name: Write release notes
        id: notes
        shell: bash
        env:
          ROUTE: ${{ needs.validate.outputs.route }}
          VERSION: ${{ needs.validate.outputs.version }}
          IDENTITY: ${{ needs.reserve.outputs.identity }}
          REQUIREMENTS_REF: ${{ needs.validate.outputs.requirements_ref }}
          TESTED_DIGEST: ${{ steps.tested.outputs.digest }}
          GHCR_DATED: ${{ steps.promote.outputs.ghcr_dated }}
          HUB_DATED: ${{ steps.promote.outputs.hub_dated }}
          GHCR_ALIAS: ${{ steps.promote.outputs.ghcr_alias }}
          HUB_ALIAS: ${{ steps.promote.outputs.hub_alias }}
          MOVE_LATEST: ${{ steps.promote.outputs.move_latest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            if [[ "$ROUTE" == "rebuild" ]]; then
              echo "Image rebuild of privacyIDEA ${VERSION}."
              echo
              echo "This is **not** an upstream privacyIDEA ${VERSION} release and no GitHub Release is created for it. It republishes the tested image under a new immutable dated identity."
            else
              echo "privacyIDEA ${VERSION} image published from commit ${GITHUB_SHA}."
            fi
            echo
            echo "| Field | Value |"
            echo "| :-- | :-- |"
            echo "| Upstream version | \`${VERSION}\` |"
            echo "| Installed privacyIDEA, as tested | \`${VERSION}\` |"
            echo "| Image release identifier | \`${IDENTITY}\` |"
            echo "| Git ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Upstream requirements ref | \`${REQUIREMENTS_REF}\` |"
            echo "| Tested multi-arch index digest | \`${TESTED_DIGEST}\` |"
            echo
            echo "| Registry | Tag | Digest |"
            echo "| :-- | :-- | :-- |"
            echo "| GHCR | \`${IDENTITY}\` | \`${GHCR_DATED}\` |"
            echo "| GHCR | \`${VERSION}\` | \`${GHCR_ALIAS}\` |"
            echo "| Docker Hub | \`${IDENTITY}\` | \`${HUB_DATED}\` |"
            echo "| Docker Hub | \`${VERSION}\` | \`${HUB_ALIAS}\` |"
            echo
            if [[ "$ROUTE" == "rebuild" ]]; then
              echo "Pointer decisions: \`v${VERSION}\`, \`latest\`, \`edge\` and \`sha-<12>\` were not touched; the numeric release ledger was not edited."
            else
              echo "Pointer decisions: \`v${VERSION}\` and \`sha-<12>\` moved with this release; \`latest\` $([[ "$MOVE_LATEST" == "true" ]] && echo "moved to the tested digest because ${VERSION} is the highest numeric release" || echo "was not moved because a newer numeric release already exists")."
            fi
            echo
            echo "Both platform images were tested on native amd64 and arm64 runners before promotion, including the CRITICAL Trivy gate. The tested GHCR index digest is \`${TESTED_DIGEST}\`."
            echo
            echo "Provenance and SBOM are attached to the GHCR index. Their availability on Docker Hub after the same-registry copy is not verified; pin and verify against GHCR when attestations matter."
          } > "$notes"
          echo "path=${notes}" >> "$GITHUB_OUTPUT"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      # Only a normal numeric release enters the numeric ledger. A rebuild
      # never creates (or edits) a GitHub release.
      - name: Create GitHub release
        if: needs.validate.outputs.route == 'numeric'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: privacyIDEA ${{ needs.validate.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          make_latest: ${{ steps.promote.outputs.move_latest }}
          draft: false
          prerelease: false

      # The release is the durable ordering record: it exists before latest
      # moves. If the pointer write fails, latest lags the ledger (safe); it
      # never gets ahead of it. A rebuild never reaches this step.
      - name: Promote latest pointer
        if: needs.validate.outputs.route == 'numeric' && steps.promote.outputs.move_latest == 'true'
        shell: bash
        env:
          NAMESPACE: ${{ steps.targets.outputs.namespace }}
          GHCR_REPO: ${{ steps.targets.outputs.ghcr_repo }}
          HUB_REPO: ${{ steps.targets.outputs.hub_repo }}
          TESTED_DIGEST: ${{ steps.tested.outputs.digest }}
          JOURNAL: ${{ runner.temp }}/promotion-journal.md
        run: |
          set -euo pipefail
          journal="$JOURNAL"

          promote_latest() {
            label="$1"
            repo="$2"
            existing=$(docker buildx imagetools inspect "${repo}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ -n "$existing" && "$existing" == "$TESTED_DIGEST" ]]; then
              echo "| ${label} | \`latest\` | \`${existing}\` |" >> "$journal"
              echo "${repo}:latest already points at the tested digest"
              return 0
            fi
            docker buildx imagetools create --tag "${repo}:latest" "${repo}@${TESTED_DIGEST}"
            digest=$(docker buildx imagetools inspect "${repo}:latest" --format '{{.Manifest.Digest}}')
            if [[ "$digest" != "$TESTED_DIGEST" ]]; then
              echo "::error::Promoted ${repo}:latest digest ${digest} differs from tested digest ${TESTED_DIGEST}"
              exit 1
            fi
            echo "| ${label} | \`latest\` | \`${digest}\` |" >> "$journal"
            echo "promoted ${repo}:latest ${digest}"
          }

          promote_latest "GHCR" "$GHCR_REPO"
          promote_latest "Docker Hub" "$HUB_REPO"

      # Uploaded even on failure: this is the evidence a human needs to
      # reconcile a partial publication (version, identity, tested digest, and
      # each tag/registry before and after).
      - name: Upload promotion journal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-promotion-${{ needs.validate.outputs.version }}-${{ needs.reserve.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-journal.md
          retention-days: 90
          if-no-files-found: warn

      - name: Publication summary
        if: always()
        shell: bash
        env:
          ROUTE: ${{ needs.validate.outputs.route }}
          VERSION: ${{ needs.validate.outputs.version }}
          IDENTITY: ${{ needs.reserve.outputs.identity }}
          MOVE_LATEST: ${{ steps.promote.outputs.move_latest }}
          TESTED_DIGEST: ${{ steps.tested.outputs.digest }}
        run: |
          journal="${RUNNER_TEMP}/promotion-journal.md"
          {
            echo "## Publication"
            echo
            echo "- Route: ${ROUTE}"
            echo "- Upstream version: ${VERSION}"
            echo "- Installed privacyIDEA, as tested: ${VERSION}"
            echo "- Image release identifier: ${IDENTITY}"
            echo "- Tested digest: ${TESTED_DIGEST:-unknown}"
            echo "- latest moved: ${MOVE_LATEST:-unknown}"
            echo
            if [[ -s "$journal" ]]; then
              cat "$journal"
            else
              echo "Promotion journal unavailable; see the workflow log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Edge is GHCR-only: no Docker Hub credentials, no GitHub release, no dated
  # identity, no latest. Kept separate from the release job so an unattended
  # main push can never reach the release environment or the Hub token.
  publish-edge:
    name: Promote edge image
    needs: [validate, build, test]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.publish == 'true' &&
      needs.validate.outputs.channel == 'edge' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-edge
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote edge tags
        shell: bash
        env:
          TESTED_DIGEST: ${{ needs.build.outputs.digest }}
          SHA_SHORT: ${{ needs.validate.outputs.sha_short }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/privacyidea"
          source="${repo}@${TESTED_DIGEST}"
          for tag in edge "sha-${SHA_SHORT}"; do
            docker buildx imagetools create --tag "${repo}:${tag}" "$source"
            digest=$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{.Manifest.Digest}}')
            if [[ "$digest" != "$TESTED_DIGEST" ]]; then
              echo "::error::Promoted ${repo}:${tag} digest ${digest} differs from tested digest ${TESTED_DIGEST}"
              exit 1
            fi
            echo "promoted ${repo}:${tag} ${digest}"
          done

      - name: Edge summary
        shell: bash
        env:
          TESTED_DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "## Edge publication"
            echo
            echo "- Installed privacyIDEA: ${VERSION}"
            echo "- Tested digest: ${TESTED_DIGEST}"
            echo "- Tags: \`edge\`, \`sha-<12>\` (GHCR only)"
            echo "- No GitHub release, no Docker Hub write, no latest/dated identity."
          } >> "$GITHUB_STEP_SUMMARY"
