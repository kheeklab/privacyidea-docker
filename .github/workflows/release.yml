name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      pi_version:
        description: 'privacyIDEA version without the v prefix (must match the selected tag ref)'
        required: true
        type: string

# No permissions by default. Every job grants only what it needs, and pull
# requests are handled by ci.yml, so untrusted code never reaches this file.
permissions: {}

env:
  PI_MIN_SUPPORTED_VERSION: '3.14'

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      channel: ${{ steps.validate.outputs.channel }}
      staging_tag: ${{ steps.validate.outputs.staging_tag }}
      sha_short: ${{ steps.validate.outputs.sha_short }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate ref and version
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.pi_version }}
          PI_MIN_SUPPORTED_VERSION: ${{ env.PI_MIN_SUPPORTED_VERSION }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          version_regex='^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          tag_regex='^v[0-9]+\.[0-9]+(\.[0-9]+)?$'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REF_TYPE" == "tag" ]] || fail "workflow_dispatch must target a release tag ref, got ${EVENT_REF}"
            [[ "$REF_NAME" =~ $tag_regex ]] || fail "ref ${REF_NAME} is not a release tag"
            version="${REF_NAME#v}"
            [[ -n "$INPUT_VERSION" ]] || fail "pi_version input is required"
            [[ "$INPUT_VERSION" == "$version" ]] || fail "pi_version ${INPUT_VERSION} does not match ref ${REF_NAME}"
            channel=release
          elif [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" =~ $tag_regex ]] || fail "ref ${REF_NAME} is not a release tag"
            version="${REF_NAME#v}"
            channel=release
          elif [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/main" ]]; then
            channel=edge
            version=$(curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused \
              https://pypi.org/pypi/privacyIDEA/json | jq -r '.info.version')
            [[ "$version" =~ $version_regex ]] || fail "resolved PyPI version ${version} is not a release version"
          else
            fail "unsupported event/ref: ${EVENT_NAME} ${EVENT_REF}"
          fi

          if [[ "$channel" == "release" ]]; then
            [[ "$version" =~ $version_regex ]] || fail "version ${version} is not a valid release version"
            highest=$(printf '%s\n%s\n' "$PI_MIN_SUPPORTED_VERSION" "$version" | sort -V | tail -1)
            [[ "$highest" == "$version" ]] || fail "version ${version} is below the supported floor ${PI_MIN_SUPPORTED_VERSION}"
          fi

          sha_short="${GITHUB_SHA:0:12}"
          [[ "$sha_short" =~ ^[0-9a-f]{12}$ ]] || fail "unexpected SHA ${GITHUB_SHA}"

          # One commit can build several versions (the feeder creates more than
          # one v* ref at the same HEAD) and main resolves a moving PyPI
          # version. A sha-only staging tag could be overwritten between build
          # and promotion, so the staging identity carries the run and the
          # version. sha-<12> remains a mutable consumer alias only.
          staging_tag="stg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${version}"
          [[ "$staging_tag" =~ ^stg-[0-9]+-[0-9]+-[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || fail "unexpected staging tag ${staging_tag}"

          {
            echo "version=$version"
            echo "channel=$channel"
            echo "staging_tag=${staging_tag}"
            echo "sha_short=$sha_short"
          } >> "$GITHUB_OUTPUT"

          echo "channel=${channel} version=${version} staging_tag=${staging_tag}"

      # A GitHub release is the publication ledger. If it exists, the version
      # was fully published; retries and re-dispatches are no-ops.
      - name: Decide whether to publish
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.validate.outputs.channel }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          publish=true
          if [[ "$CHANNEL" == "release" ]]; then
            if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v${VERSION} already has a release; publication is idempotent and will be skipped"
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build staging image
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.staging.outputs.digest }}
      sha_short: ${{ needs.validate.outputs.sha_short }}
      dockerhub: ${{ steps.targets.outputs.dockerhub }}
      namespace: ${{ steps.targets.outputs.namespace }}
      hub_digest: ${{ steps.staging.outputs.hub_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Staging tags are build identities, never consumer tags. Docker Hub
      # staging is required because a cross-registry index copy is not proven;
      # see the deviation note in the pull request and PERS-56 ADR-003.
      - name: Resolve staging targets
        id: targets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          STAGING_TAG: ${{ needs.validate.outputs.staging_tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          namespace="${DOCKERHUB_NAMESPACE:-$owner}"
          dockerhub=false

          # Docker Hub credentials exist only for release-channel runs. Edge
          # builds from main are GHCR-only, so the credential is never
          # reachable from an unattended main push.
          if [[ "$CHANNEL" == "release" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
              echo "::error::Docker Hub credentials are required for a release but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not configured"
              exit 1
            fi
            dockerhub=true
          fi
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${owner}/privacyidea:${STAGING_TAG}"
            if [[ "$dockerhub" == "true" ]]; then
              echo "${namespace,,}/privacyidea:${STAGING_TAG}"
            fi
            echo 'EOF'
            echo "dockerhub=${dockerhub}"
            echo "namespace=${namespace,,}"
            echo "owner=${owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.targets.outputs.tags }}
          build-args: |
            PI_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record staging digest
        id: staging
        shell: bash
        env:
          STAGING_TAG: ${{ needs.validate.outputs.staging_tag }}
          OWNER: ${{ steps.targets.outputs.owner }}
          DOCKERHUB_ENABLED: ${{ steps.targets.outputs.dockerhub }}
          DOCKERHUB_NAMESPACE: ${{ steps.targets.outputs.namespace }}
        run: |
          set -euo pipefail
          ghcr_ref="ghcr.io/${OWNER}/privacyidea:${STAGING_TAG}"
          digest=$(docker buildx imagetools inspect "$ghcr_ref" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Unexpected staging digest for ${ghcr_ref}: ${digest}" >&2
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "staging ${ghcr_ref} ${digest}"
          if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
            dockerhub_ref="${DOCKERHUB_NAMESPACE}/privacyidea:${STAGING_TAG}"
            dockerhub_digest=$(docker buildx imagetools inspect "$dockerhub_ref" --format '{{.Manifest.Digest}}')

            # The tested artifact is the GHCR index. A Docker Hub staging copy
            # that is not byte-identical must never reach a consumer tag.
            if [[ "$dockerhub_digest" != "$digest" ]]; then
              echo "::error::Docker Hub staging digest ${dockerhub_digest} differs from tested GHCR staging digest ${digest}; refusing to promote"
              exit 1
            fi
            echo "hub_digest=${dockerhub_digest}" >> "$GITHUB_OUTPUT"
            echo "staging ${dockerhub_ref} ${dockerhub_digest}"
          fi

  test:
    name: Test ${{ matrix.arch }} staging image
    needs: [validate, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GHCR (read only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the exact tested index digest on a native runner. No image is
      # rebuilt here, so the tested manifests are the published manifests.
      - name: Pull staging image by digest
        shell: bash
        env:
          STAGING_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker pull "ghcr.io/${owner}/privacyidea@${STAGING_DIGEST}"
          docker tag "ghcr.io/${owner}/privacyidea@${STAGING_DIGEST}" privacyidea:test

      - name: Install container-structure-test
        env:
          CST_VERSION: 1.22.1
          CST_AMD64_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
          CST_ARM64_SHA256: 801826ed107222120eb6df8c143b7de752cfebbe3aebfeea576e7098486917c2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$CST_AMD64_SHA256" ;;
            aarch64|arm64) arch=arm64; sha="$CST_ARM64_SHA256" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          binary="/tmp/container-structure-test"
          curl -fsSL -o "$binary" \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CST_VERSION}/container-structure-test-linux-${arch}"
          echo "${sha}  ${binary}" | sha256sum -c -
          chmod +x "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/container-structure-test
          container-structure-test version

      - name: Container structure test
        run: container-structure-test test --image privacyidea:test --config structure-tests.yaml

      - name: Integration test
        run: |
          set -euo pipefail
          docker compose --file docker-compose-test.yml up --no-build --exit-code-from sut --timeout 120
          docker compose --file docker-compose-test.yml down -v

      - name: Assert installed privacyIDEA version
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          installed=$(docker run --rm --entrypoint /opt/privacyidea/bin/python privacyidea:test \
            -c 'import importlib.metadata as m; print(m.version("privacyIDEA"))')
          echo "expected=${EXPECTED_VERSION} installed=${installed}"
          if [[ "$installed" != "$EXPECTED_VERSION" ]]; then
            echo "Installed privacyIDEA ${installed} does not match requested ${EXPECTED_VERSION}" >&2
            exit 1
          fi

      # Fixed CRITICAL findings block promotion; unfixed ones are reported but
      # cannot block (base-image CVEs are not fixable here). Time-boxed
      # exceptions belong in .trivyignore with an owner and expiry comment.
      - name: Trivy scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: privacyidea:test
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.arch }}

      - name: Cleanup compose stack
        if: always()
        run: docker compose --file docker-compose-test.yml down -v || true

  publish:
    name: Promote tested image
    needs: [validate, build, test]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
    # Serialize publication so two releases cannot interleave latest/promotion.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.build.outputs.dockerhub == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The release ledger is read completely and fail-closed: an API error or
      # an unreadable response aborts instead of producing an empty ledger.
      # A release is created before `latest` moves, so a crash can leave latest
      # behind, never ahead.
      - name: Compute target tags and latest ordering
        id: targets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHA_SHORT: ${{ needs.validate.outputs.sha_short }}
          TESTED_DIGEST: ${{ needs.build.outputs.digest }}
          NAMESPACE: ${{ needs.build.outputs.namespace }}
          DOCKERHUB_ENABLED: ${{ needs.build.outputs.dockerhub }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sha_short="${SHA_SHORT:?}"
          date_tag=$(date -u +%Y%m%d)
          move_latest=false

          if [[ "$CHANNEL" == "release" ]]; then
            tags=("v${VERSION}" "${VERSION}" "${VERSION}-${date_tag}" "sha-${sha_short}")

            if ! releases_json=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100"); then
              echo "::error::Could not read the GitHub release ledger; refusing to compute latest ordering"
              exit 1
            fi
            if ! jq -e 'type == "array"' >/dev/null <<< "$releases_json"; then
              echo "::error::Release ledger response was not a JSON array"
              exit 1
            fi

            mapfile -t released < <(
              jq -r '.[][]? // empty | .tag_name' <<< "$releases_json" \
                | sed 's/^v//' \
                | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
                | sort -V \
                || true
            )
            current_max=""
            if [[ ${#released[@]} -gt 0 ]]; then
              current_max="${released[-1]}"
            fi

            # Bootstrap guard: an empty ledger with an existing latest pointer
            # means the ledger no longer describes the registry. Refuse to
            # guess, because guessing can move latest backward.
            existing_latest=$(docker buildx imagetools inspect "ghcr.io/${owner}/privacyidea:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            hub_latest=""
            if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
              hub_latest=$(docker buildx imagetools inspect "${NAMESPACE}/privacyidea:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            fi
            if [[ -z "$current_max" && ( -n "$existing_latest" || -n "$hub_latest" ) ]]; then
              echo "::error::No GitHub release exists but a latest tag is published (ghcr=${existing_latest:-none}, dockerhub=${hub_latest:-none}); establish the release-ledger baseline before the first release (see docs/release-runbook.md)"
              exit 1
            fi

            if [[ -z "$current_max" ]]; then
              move_latest=true
            elif [[ "$VERSION" != "$current_max" ]]; then
              highest=$(printf '%s\n%s\n' "$current_max" "$VERSION" | sort -V | tail -1)
              [[ "$highest" == "$VERSION" ]] && move_latest=true
            fi
            echo "current latest release: ${current_max:-none}; move_latest=${move_latest}"
          else
            tags=("edge" "sha-${sha_short}")
          fi

          # latest is not in this list. It moves only after the GitHub release
          # exists, so the ledger records the version before the pointer moves.
          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
            echo "move_latest=${move_latest}"
            echo "owner=${owner}"
            echo "date_tag=${date_tag}"
          } >> "$GITHUB_OUTPUT"

          journal="${RUNNER_TEMP}/promotion-journal.md"
          {
            echo "# Promotion journal"
            echo
            echo "- version: ${VERSION}"
            echo "- run: ${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID:-0}/attempts/${GITHUB_RUN_ATTEMPT:-0}"
            echo "- tested index digest: ${TESTED_DIGEST:?}"
            echo "- latest move: ${move_latest}"
            echo
            echo "| Registry | Tag | Digest |"
            echo "| :-- | :-- | :-- |"
          } > "$journal"

      - name: Promote GHCR tags
        id: promote_ghcr
        shell: bash
        env:
          OWNER: ${{ steps.targets.outputs.owner }}
          TAGS: ${{ steps.targets.outputs.tags }}
          STAGING_DIGEST: ${{ needs.build.outputs.digest }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER}/privacyidea"
          source="${repo}@${STAGING_DIGEST}"
          journal="${RUNNER_TEMP}/promotion-journal.md"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            existing=$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ -n "$existing" && "$existing" == "$STAGING_DIGEST" ]]; then
              echo "${tag}=${existing}" >> "$GITHUB_OUTPUT"
              echo "| GHCR | \`${tag}\` | \`${existing}\` |" >> "$journal"
              echo "${repo}:${tag} already points at the tested digest"
              continue
            fi
            if [[ -n "$existing" && "$existing" != "$STAGING_DIGEST" ]]; then
              if [[ "$CHANNEL" == "release" && "$tag" != sha-* ]]; then
                echo "::error::Refusing to overwrite published tag ${repo}:${tag} (${existing}) with ${STAGING_DIGEST}. Restoring or re-releasing an existing version needs a human-approved republish."
                exit 1
              fi
            fi
            docker buildx imagetools create --tag "${repo}:${tag}" "$source"
            digest=$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{.Manifest.Digest}}')
            if [[ "$digest" != "$STAGING_DIGEST" ]]; then
              echo "::error::Promoted ${repo}:${tag} digest ${digest} differs from tested staging digest ${STAGING_DIGEST}"
              exit 1
            fi
            echo "${tag}=${digest}" >> "$GITHUB_OUTPUT"
            echo "| GHCR | \`${tag}\` | \`${digest}\` |" >> "$journal"
            echo "promoted ${repo}:${tag} ${digest}"
          done <<< "$TAGS"

      - name: Promote Docker Hub tags
        id: promote_dockerhub
        if: needs.build.outputs.dockerhub == 'true'
        shell: bash
        env:
          NAMESPACE: ${{ needs.build.outputs.namespace }}
          REPO_OWNER: ${{ steps.targets.outputs.owner }}
          TAGS: ${{ steps.targets.outputs.tags }}
          TESTED_DIGEST: ${{ needs.build.outputs.digest }}
          HUB_DIGEST: ${{ needs.build.outputs.hub_digest }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          namespace="${NAMESPACE:-$REPO_OWNER}"
          namespace="${namespace,,}"
          repo="${namespace}/privacyidea"

          # Promote the immutable tested digest, not a mutable staging tag.
          # The build job already asserted Hub staging equals the GHCR tested
          # index; this is the second, independent check before any write.
          if [[ "${HUB_DIGEST:?}" != "${TESTED_DIGEST:?}" ]]; then
            echo "::error::Docker Hub staging digest ${HUB_DIGEST} is not the tested digest ${TESTED_DIGEST}"
            exit 1
          fi
          source="${repo}@${TESTED_DIGEST}"
          journal="${RUNNER_TEMP}/promotion-journal.md"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            existing=$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ -n "$existing" && "$existing" == "$TESTED_DIGEST" ]]; then
              echo "${tag}=${existing}" >> "$GITHUB_OUTPUT"
              echo "| Docker Hub | \`${tag}\` | \`${existing}\` |" >> "$journal"
              echo "${repo}:${tag} already points at the tested digest"
              continue
            fi
            if [[ -n "$existing" && "$existing" != "$TESTED_DIGEST" ]]; then
              if [[ "$CHANNEL" == "release" && "$tag" != sha-* ]]; then
                echo "::error::Refusing to overwrite published tag ${repo}:${tag} (${existing}) with ${TESTED_DIGEST}. Restoring or re-releasing an existing version needs a human-approved republish."
                exit 1
              fi
            fi
            docker buildx imagetools create --tag "${repo}:${tag}" "$source"
            digest=$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{.Manifest.Digest}}')
            if [[ "$digest" != "$TESTED_DIGEST" ]]; then
              echo "::error::Promoted ${repo}:${tag} digest ${digest} differs from tested staging digest ${TESTED_DIGEST}"
              exit 1
            fi
            echo "${tag}=${digest}" >> "$GITHUB_OUTPUT"
            echo "| Docker Hub | \`${tag}\` | \`${digest}\` |" >> "$journal"
            echo "promoted ${repo}:${tag} ${digest}"
          done <<< "$TAGS"

      - name: Write release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          STAGING_DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.targets.outputs.tags }}
          DOCKERHUB_ENABLED: ${{ needs.build.outputs.dockerhub }}
          GHCR_TAGS: ${{ toJSON(steps.promote_ghcr.outputs) }}
          DOCKERHUB_TAGS: ${{ toJSON(steps.promote_dockerhub.outputs) }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "privacyIDEA ${VERSION} image published from commit ${GITHUB_SHA}."
            echo
            echo "| Registry | Tag | Digest |"
            echo "| :-- | :-- | :-- |"
            echo "$TAGS" | while IFS= read -r tag; do
              [[ -n "$tag" ]] || continue
              ghcr_digest=$(echo "$GHCR_TAGS" | jq -r --arg t "$tag" '.[$t] // empty')
              echo "| GHCR | \`${tag}\` | \`${ghcr_digest:-not-published}\` |"
            done
            if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
              echo "$TAGS" | while IFS= read -r tag; do
                [[ -n "$tag" ]] || continue
                hub_digest=$(echo "$DOCKERHUB_TAGS" | jq -r --arg t "$tag" '.[$t] // empty')
                echo "| Docker Hub | \`${tag}\` | \`${hub_digest:-not-published}\` |"
              done
            fi
            echo
            echo "Both platform images were tested on native amd64 and arm64 runners before promotion. The tested GHCR index digest is \`${STAGING_DIGEST}\`."
            echo
            echo "Provenance and SBOM are attached to the GHCR index. Their availability on Docker Hub after the same-registry copy is not verified; pin and verify against GHCR when attestations matter."
            if [[ "$CHANNEL" == "edge" ]]; then
              echo
              echo "This is an \`edge\` build from \`main\`; it is not a stable release."
            fi
          } > "$notes"
          echo "path=${notes}" >> "$GITHUB_OUTPUT"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      # The release is the durable ordering record: it exists before latest
      # moves. If the pointer write fails, latest lags the ledger (safe); it
      # never gets ahead of it.
      - name: Create GitHub release
        if: needs.validate.outputs.channel == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: privacyIDEA ${{ needs.validate.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          make_latest: ${{ steps.targets.outputs.move_latest }}
          draft: false
          prerelease: false

      - name: Promote latest pointer
        if: needs.validate.outputs.channel == 'release' && steps.targets.outputs.move_latest == 'true'
        shell: bash
        env:
          OWNER: ${{ steps.targets.outputs.owner }}
          NAMESPACE: ${{ needs.build.outputs.namespace }}
          DOCKERHUB_ENABLED: ${{ needs.build.outputs.dockerhub }}
          TESTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          journal="${RUNNER_TEMP}/promotion-journal.md"

          promote_latest() {
            label="$1"
            repo="$2"
            existing=$(docker buildx imagetools inspect "${repo}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ -n "$existing" && "$existing" == "$TESTED_DIGEST" ]]; then
              echo "| ${label} | \`latest\` | \`${existing}\` |" >> "$journal"
              echo "${repo}:latest already points at the tested digest"
              return 0
            fi
            docker buildx imagetools create --tag "${repo}:latest" "${repo}@${TESTED_DIGEST}"
            digest=$(docker buildx imagetools inspect "${repo}:latest" --format '{{.Manifest.Digest}}')
            if [[ "$digest" != "$TESTED_DIGEST" ]]; then
              echo "::error::Promoted ${repo}:latest digest ${digest} differs from tested digest ${TESTED_DIGEST}"
              exit 1
            fi
            echo "| ${label} | \`latest\` | \`${digest}\` |" >> "$journal"
            echo "promoted ${repo}:latest ${digest}"
          }

          promote_latest "GHCR" "ghcr.io/${OWNER}/privacyidea"
          if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
            promote_latest "Docker Hub" "${NAMESPACE}/privacyidea"
          fi

      # Uploaded even on failure: this is the evidence a human needs to
      # reconcile a partial publication (version, run, tested digest, and each
      # tag actually written).
      - name: Upload promotion journal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-promotion-${{ needs.validate.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-journal.md
          retention-days: 90
          if-no-files-found: warn

      - name: Publication summary
        if: always()
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          MOVE_LATEST: ${{ steps.targets.outputs.move_latest }}
          TESTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          journal="${RUNNER_TEMP}/promotion-journal.md"
          {
            echo "## Publication"
            echo
            echo "- Channel: ${CHANNEL}"
            echo "- Version: ${VERSION}"
            echo "- Tested digest: ${TESTED_DIGEST:-unknown}"
            echo "- latest moved: ${MOVE_LATEST:-unknown}"
            echo
            if [[ -s "$journal" ]]; then
              cat "$journal"
            else
              echo "Promotion journal unavailable; see the workflow log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
